<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f8f4ee;color:#1a1412;font-family:'Be Vietnam Pro',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#a3161c;text-decoration:none}a:hover{color:#7d0f14}*{box-sizing:border-box}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes scan{0%,100%{top:6%}50%{top:88%}}
</style>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Site Header" style="position:sticky;top:0;z-index:40;display:block" hint-size="100%,64px"></dc-import>
  <section style="max-width:1180px;margin:0 auto;padding:88px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center">
    <div style="display:flex;flex-direction:column;gap:22px;animation:fadeUp .8s both">
      <span style="font-size:12px;letter-spacing:.22em;color:#8a6425;font-weight:600">QR TIỀN MỪNG CƯỚI</span>
      <h1 style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(38px,5.4vw,60px);line-height:1.08">Khách ở xa vẫn <em style="color:#8a6425">gửi mừng được</em></h1>
      <p style="margin:0;font-size:16px;line-height:1.75;color:#5e534b;max-width:460px">Đặt mã QR chuyển khoản ngay trong thiệp cưới online. Khách chỉ cần mở thiệp, quét mã và chuyển khoản trong vài giây.</p>
      <a href="Studio.dc.html" style="align-self:flex-start;background:#a3161c;color:#fff;padding:16px 26px;border-radius:999px;font-size:15px;font-weight:500" style-hover="background:#7d0f14;color:#fff">Tạo thiệp có QR mừng cưới</a>
    </div>
    <div style="justify-self:center;background:#fff;border-radius:24px;padding:28px;box-shadow:0 30px 60px -30px rgba(26,20,18,.35);width:100%;max-width:320px">
      <div style="position:relative;aspect-ratio:1;border-radius:14px;border:1px solid #efe6d9;background:#f4efe8;overflow:hidden">
        <div style="position:absolute;left:8px;right:8px;height:2px;background:#a3161c;box-shadow:0 0 12px 2px rgba(163,22,28,.5);animation:scan 2.4s ease-in-out infinite"></div>
        <div style="display:grid;place-items:center;width:100%;height:100%;color:#b0a498;font-size:13px">Mã QR ngân hàng</div>
      </div>
      <div style="margin-top:16px;display:flex;flex-direction:column;gap:4px;text-align:center"><span style="font-family:'Playfair Display',serif;font-size:18px">Hạ Vy &amp; Minh Khôi</span><span style="font-size:12px;color:#8a7d72">Quét để gửi lời chúc mừng</span></div>
    </div>
  </section>
  <section style="max-width:900px;margin:0 auto;padding:0 32px 96px;display:flex;flex-direction:column;gap:20px">
    <span style="font-family:'Playfair Display',serif;font-size:26px;text-align:center">Ba bước đặt QR mừng cưới</span>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3"><div style="border-top:1px solid #1a1412;padding-top:14px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Playfair Display',serif;font-style:italic;font-size:32px;color:#c9a86a">{{ s.n }}</span><span style="font-size:15px;line-height:1.6;color:#3d342e">{{ s.t }}</span></div></sc-for>
    </div>
  </section>
  <dc-import name="Site Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { steps: [['01','Vào tab Mừng cưới trong trình chỉnh sửa'],['02','Chọn ngân hàng và tải ảnh mã QR lên'],['03','Lưu lại, mã QR hiện ngay trên thiệp của khách']].map(([n,t]) => ({n,t})) }; }
}
</script>
</body>
</html>
