<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f8f4ee;color:#1a1412;font-family:'Be Vietnam Pro',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#a3161c;text-decoration:none}a:hover{color:#7d0f14}*{box-sizing:border-box}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Site Header" style="position:sticky;top:0;z-index:40;display:block" hint-size="100%,64px"></dc-import>
  <section style="max-width:1000px;margin:0 auto;padding:88px 32px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px">
    <span style="font-size:12px;letter-spacing:.22em;color:#8a6425;font-weight:600;animation:fadeUp .8s both">TIN NHẮN MỜI CƯỚI</span>
    <h1 style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(36px,5.2vw,58px);line-height:1.1;animation:fadeUp .9s .1s both">Kèm link thiệp vào một dòng <em style="color:#8a6425">tin nhắn thật hay</em></h1>
    <p style="margin:0;font-size:16px;line-height:1.75;color:#5e534b;max-width:520px;animation:fadeUp .9s .2s both">Vài mẫu câu để gửi kèm link thiệp qua Zalo, Messenger hoặc SMS.</p>
    <a href="Cong Cu.dc.html" style="background:#a3161c;color:#fff;padding:15px 24px;border-radius:999px;font-size:14px;font-weight:500;animation:fadeUp .9s .3s both" style-hover="background:#7d0f14;color:#fff">Dùng công cụ sinh tin nhắn →</a>
  </section>
  <section style="max-width:820px;margin:0 auto;padding:0 32px 96px;display:flex;flex-direction:column;gap:20px">
    <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="4">
      <div style="background:#fff;border-radius:16px;padding:24px;box-shadow:0 16px 30px -22px rgba(26,20,18,.3);display:flex;flex-direction:column;gap:10px">
        <span style="font-size:12px;letter-spacing:.15em;color:#8a6425;font-weight:600">{{ m.tag }}</span>
        <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.6;color:#3d342e">{{ m.t }}</span>
      </div>
    </sc-for>
  </section>
  <dc-import name="Site Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { msgs: [
      ['TRANG TRỌNG','Kính mời anh/chị đến chung vui trong ngày trọng đại của chúng tôi. Mọi thông tin chi tiết, chúng tôi đã gửi trong thiệp mời: [link thiệp].'],
      ['THÂN MẬT','Ê, tụi mình cưới rồi nè! Ghé xem thiệp mời đi, nhớ xác nhận tham dự giúp bọn mình nha: [link thiệp] 🥂'],
      ['GỬI HỌ HÀNG','Con/cháu xin kính báo ngày vui của con/cháu. Kính mong ông bà, chú bác đến chung vui, thông tin chi tiết trong link sau: [link thiệp].'],
      ['NHẮC LẠI','Chỉ còn vài ngày nữa là đến ngày cưới của tụi mình rồi! Mong mọi người xác nhận tham dự nếu chưa xác nhận nhé: [link thiệp]'],
    ].map(([tag,t]) => ({tag,t})) };
  }
}
</script>
</body>
</html>
