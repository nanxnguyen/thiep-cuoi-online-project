<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f8f4ee;color:#1a1412;font-family:'Be Vietnam Pro',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#a3161c;text-decoration:none}a:hover{color:#7d0f14}*{box-sizing:border-box}
input::placeholder{color:#b7a998}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes swapIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanline{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
</style>
<script src="motion.js"></script>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Site Header" style="position:sticky;top:0;z-index:40;display:block" hint-size="100%,64px"></dc-import>
  <main style="display:grid;grid-template-columns:minmax(340px,34%) minmax(0,1fr)">
    <aside style="position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);background:{{ cur.deep }};color:#f4ece0;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:44px 36px;overflow-y:auto;transition:background .6s ease">
      <div style="display:flex;flex-direction:column;gap:26px">
        <div style="display:flex;flex-direction:column;gap:8px;animation:fadeUp .7s both">
          <span style="font-size:11px;letter-spacing:.26em;color:{{ cur.gold }};font-weight:600">MỘC · TẠO THIỆP MỚI</span>
          <h1 style="margin:0;font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(26px,3vw,36px);line-height:1.1;color:#fff">{{ cur.a }} & {{ cur.b }}</h1>
        </div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <sc-for list="{{ stepItems }}" as="st" hint-placeholder-count="3">
            <div style="display:flex;gap:10px;align-items:center;opacity:{{ st.opacity }}">
              <span style="font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:{{ cur.gold }}">{{ st.num }}</span>
              <span style="font-size:13px;letter-spacing:.03em;color:#f4ece0;font-weight:{{ st.weight }}">{{ st.label }}</span>
            </div>
          </sc-for>
        </div>
        <div style="align-self:center;position:relative;animation:floaty 6s ease-in-out infinite;margin-top:6px">
          <div key="{{ cur.id }}" style="border-radius:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);animation:swapIn .5s cubic-bezier(.2,.8,.2,1) both"><dc-import name="Thiep Preview" family="{{ cur.family }}" deep="{{ cur.deep }}" paper="{{ cur.paper }}" gold="{{ cur.gold }}" tint="{{ cur.tint }}" a="{{ cur.a }}" b="{{ cur.b }}" date="{{ cur.date }}" place="HÀ NỘI" slot="studioB-big" locked="true" hint-size="180px,320px"></dc-import></div>
        </div>
        <div style="text-align:center;display:flex;flex-direction:column;gap:3px">
          <span style="font-family:'Playfair Display',serif;font-size:22px;color:#fff">{{ cur.name }}</span>
          <span style="font-size:12px;color:#f4ece0;opacity:.7">{{ cur.style }}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px">
        <label style="display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:14px;border:1.5px dashed rgba(244,236,224,.35);background:rgba(0,0,0,.12);cursor:pointer;transition:all .25s" style-hover="border-color:rgba(244,236,224,.7)">
          <span style="width:42px;height:42px;flex:none;border-radius:9px;overflow:hidden;position:relative;background:rgba(0,0,0,.2);display:grid;place-items:center;font-size:17px;color:#f4ece0">{{ scanIcon }}<sc-if value="{{ hasScanImg }}" hint-placeholder-val="{{ false }}"><img src="{{ scanImg }}" alt="Ảnh thiệp giấy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></sc-if><sc-if value="{{ scanning }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;height:2px;background:#f4ece0;box-shadow:0 0 8px #f4ece0;animation:scanline 1.2s ease-in-out infinite"></span></sc-if></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:12px;font-weight:500;color:#fff">{{ scanTitle }}</span><span style="font-size:10.5px;line-height:1.45;color:rgba(244,236,224,.65)">{{ scanSub }}</span></span>
          <input type="file" accept="image/*" onChange="{{ onScan }}" style="display:none">
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.04em;color:rgba(244,236,224,.65)">CÔ DÂU<input value="{{ a }}" onInput="{{ onA }}" style="font-family:'Cormorant Garamond',serif;font-size:18px;padding:7px 1px;border:none;border-bottom:1.5px solid rgba(244,236,224,.3);background:transparent;outline:none;color:#fff" style-focus="border-color:#fff"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.04em;color:rgba(244,236,224,.65)">CHÚ RỂ<input value="{{ b }}" onInput="{{ onB }}" style="font-family:'Cormorant Garamond',serif;font-size:18px;padding:7px 1px;border:none;border-bottom:1.5px solid rgba(244,236,224,.3);background:transparent;outline:none;color:#fff" style-focus="border-color:#fff"></label>
          <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.04em;color:rgba(244,236,224,.65)">NGÀY CƯỚI<input type="date" value="{{ date }}" onInput="{{ onDate }}" style="font-family:'Be Vietnam Pro',sans-serif;font-size:14px;padding:8px 1px;border:none;border-bottom:1.5px solid rgba(244,236,224,.3);background:transparent;outline:none;color:#fff" style-focus="border-color:#fff"></label>
        </div>
        <a href="Studio Editor v3.dc.html" onClick="{{ go }}" style="text-align:center;background:#fff;color:#1a1412;padding:16px;border-radius:999px;font-size:14px;font-weight:600;display:flex;gap:10px;justify-content:center;align-items:center;box-shadow:0 14px 28px -14px rgba(0,0,0,.45)" style-hover="background:#f4ece0;color:#1a1412"><sc-if value="{{ going }}" hint-placeholder-val="{{ false }}"><span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(26,20,18,.3);border-top-color:#1a1412;animation:spin .7s linear infinite"></span></sc-if>{{ goLabel }}</a>
        <span style="font-size:11px;line-height:1.5;color:rgba(244,236,224,.55);text-align:center">Không cần đăng nhập. Mộc sẽ cấp một link sửa riêng, hãy lưu lại link đó.</span>
      </div>
    </aside>
    <div style="padding:64px 48px 120px;display:flex;flex-direction:column;gap:32px;min-width:0">
      <div style="display:flex;flex-direction:column;gap:12px;animation:fadeUp .7s both">
        <span style="font-size:12px;letter-spacing:.2em;color:#8a6425;font-weight:600">BƯỚC 1 / 3</span>
        <h2 style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(32px,3.6vw,46px);line-height:1.04">Chọn một mẫu thiệp</h2>
        <p style="margin:0;color:#5e534b;font-size:15px;max-width:480px;line-height:1.7">Đổi mẫu lúc nào cũng được, nội dung của bạn vẫn còn nguyên.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
          <button onClick="{{ c.pick }}" style="font-family:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};cursor:pointer;display:flex;gap:6px;align-items:center;transition:all .2s">{{ c.label }}<span style="font-size:11px;opacity:.6">{{ c.n }}</span></button>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 20px">
        <sc-for list="{{ tpls }}" as="t" hint-placeholder-count="20">
          <button onClick="{{ t.pick }}" style="font-family:inherit;padding:0;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;animation:fadeUp .5s both;animation-delay:{{ t.delay }}">
            <div style="border-radius:10px;overflow:hidden;position:relative;box-shadow:{{ t.shadow }};transform:{{ t.lift }};transition:all .35s cubic-bezier(.2,.7,.2,1)" style-hover="transform:translateY(-6px) scale(1.015)">
              <dc-import name="Thiep Preview" family="{{ t.family }}" deep="{{ t.deep }}" paper="{{ t.paper }}" gold="{{ t.gold }}" tint="{{ t.tint }}" a="{{ t.a }}" b="{{ t.b }}" date="{{ t.date }}" place="{{ t.place }}" slot="{{ t.slot }}" radius="0px" locked="true" hint-size="100%,250px"></dc-import>
              <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:{{ t.deep }};color:#fff;display:grid;place-items:center;font-size:12px;animation:swapIn .3s both">✓</span></sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px">
              <span style="font-family:'Playfair Display',serif;font-size:15px">{{ t.name }}</span>
              <span style="font-size:11px;color:#8a7d72">{{ t.style }}</span>
            </div>
          </button>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PAL = { do:['#8e1b1f','#f7efe3','#e0bb74'], dodam:['#5a1119','#f5ece2','#d4ac6a'], nau:['#6b4a33','#f3ece2','#b88a55'], lam:['#1f3a5f','#eef1f4','#c9ab72'], xanh:['#24493a','#eef1ea','#c9a86a'], hong:['#a4505f','#fbf1ef','#d8a977'], vang:['#7a5a22','#f7f0e0','#e3c27e'], oliu:['#5a6636','#f2f1e6','#c8b07a'], cam:['#9a4a28','#f7eee6','#d9a86a'], muc:['#1a1412','#f4f1ec','#c9a86a'], tim:['#4b3566','#f2eff5','#c7a878'] };
const TPL = [[1,'Song Hỷ','Truyền thống','A','do','Chữ Hỷ'],[2,'Nét Mực','Tối giản','B','dodam','Typography'],[3,'Hoa Nhài','Hoa','C','xanh','Vòm hoa'],[4,'Hoàng Gia','Cổ điển','D','vang','Khung vàng'],[5,'Phong Thư','Lãng mạn','E','do','Phong bì'],[6,'Bìa Báo','Hiện đại','F','muc','Tạp chí'],[7,'Hỷ Sự','Truyền thống','P','dodam','Chữ Hỷ'],[9,'Vườn Ươm','Hoa','Q','oliu','Sân vườn'],[10,'Nhung Lam','Cổ điển','R','lam','Nhung'],[11,'Thư Tình','Lãng mạn','S','hong','Sáp niêm'],[12,'Chân Dung','Hiện đại','T','muc','Ảnh lớn'],[13,'Song Phụng','Truyền thống','I','do','Chữ Hỷ lớn'],[14,'Báo Hỷ','Truyền thống','H','do','Thông tin lễ'],[15,'Đôi Khung','Lãng mạn','G','xanh','Ảnh đôi'],[16,'Song Cửa','Truyền thống','J','dodam','Khung vòm'],[17,'Tem Thư','Lãng mạn','K','do','Tem & dấu bưu điện'],[18,'Vé Hạnh Phúc','Hiện đại','L','lam','Vé tàu'],[19,'Đĩa Than','Hiện đại','M','muc','Vinyl'],[20,'Cuộn Phim','Hiện đại','N','muc','Phim nhựa'],[21,'Lịch Bloc','Truyền thống','O','do','Lịch xé']];
class Component extends DCLogic {
  state = { sel: 0, filter: 'Tất cả', a: 'Hạ Vy', b: 'Minh Khôi', date: '2026-11-09', going: false, scan: 'idle', scanImg: '' };
  fmt(d) { const [y, m, dd] = (d || '').split('-'); return y ? `${dd} · ${m} · ${y}` : ''; }
  renderVals() {
    const s = this.state, date = this.fmt(s.date);
    const all = TPL.map(([id, name, style, family, pal, motif], i) => { const [deep, paper, gold] = PAL[pal] || PAL.do; const on = i === s.sel;
      return { id, name, style: style + ' · ' + motif, cat: style, family, deep, paper, gold, tint: deep + '1f', a: s.a || 'Cô dâu', b: s.b || 'Chú rể', date, place: 'HÀ NỘI', slot: `studioB-${id}`, on,
        shadow: on ? `0 0 0 3px ${deep}, 0 18px 32px -20px ${deep}99` : '0 12px 22px -16px rgba(26,20,18,.35)',
        lift: on ? 'translateY(-4px)' : 'none', delay: `${i * .04}s`, pick: () => this.setState({ sel: i }) }; });
    const cats = ['Tất cả', ...new Set(TPL.map(t => t[2]))];
    const tpls = all.filter(t => s.filter === 'Tất cả' || t.cat === s.filter).map((t, j) => ({ ...t, delay: `${j * .03}s` }));
    const chips = cats.map(c => { const on = c === s.filter, n = c === 'Tất cả' ? all.length : all.filter(t => t.cat === c).length;
      return { label: c, n, bg: on ? '#1a1412' : '#fff', fg: on ? '#fff' : '#5e534b', bd: on ? '#1a1412' : '#e0d5c6', pick: () => this.setState({ filter: c }) }; });
    const cur = all[s.sel];
    const stepLabels = ['Chọn mẫu', 'Tên hai bạn', 'Chỉnh sửa'];
    const stepItems = stepLabels.map((label, i) => ({ num: ['I','II','III'][i], label, opacity: i === 0 ? 1 : .45, weight: i === 0 ? 600 : 400 }));
    return { tpls, cur, chips, stepItems, count: tpls.length, a: s.a, b: s.b, date: s.date,
      onA: e => this.setState({ a: e.target.value }), onB: e => this.setState({ b: e.target.value }), onDate: e => this.setState({ date: e.target.value }),
      scanning: s.scan === 'busy', hasScanImg: !!s.scanImg, scanImg: s.scanImg, scanIcon: s.scanImg ? '' : '⌗',
      scanTitle: { idle: 'Đã có thiệp giấy? Chụp để AI điền sẵn', busy: 'Đang đọc thiệp…', done: 'Đã điền từ ảnh thiệp' }[s.scan],
      scanSub: { idle: 'AI đọc tên và ngày cưới từ ảnh chụp thiệp.', busy: 'Tìm tên hai bạn và ngày cưới', done: 'Kiểm tra lại bên dưới. Bản thử dùng dữ liệu mô phỏng.' }[s.scan],
      onScan: e => { const f = e.target.files && e.target.files[0]; if (!f) return; this.setState({ scan: 'busy', scanImg: URL.createObjectURL(f) }); e.target.value = '';
        clearTimeout(this._sc); this._sc = setTimeout(() => this.setState({ scan: 'done', a: 'Thanh Hà', b: 'Tuấn Kiệt', date: '2027-01-05' }), 2200); },
      going: s.going, goLabel: s.going ? 'Đang tạo…' : 'Bắt đầu chỉnh sửa →',
      go: e => { e.preventDefault(); this.setState({ going: true }); setTimeout(() => { location.href = 'Studio Editor v3.dc.html'; }, 900); } };
  }
}
</script>
</body>
</html>
