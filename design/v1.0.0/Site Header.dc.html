<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
@keyframes mocFade{from{opacity:0}to{opacity:1}}
@keyframes mocPop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes mocDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes mocSpin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="font-family:'Be Vietnam Pro',sans-serif">
<header style="background:rgba(248,244,238,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e8dfd3">
  <div style="max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:32px;flex-wrap:wrap">
    <a href="Trang Chu.dc.html" style="display:flex;align-items:center;gap:12px;color:#1a1412;text-decoration:none">
      <span style="width:34px;height:34px;border-radius:8px;background:#a3161c;color:#f8f4ee;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:18px;font-weight:600">M</span>
      <span style="font-family:'Playfair Display',serif;font-size:19px;letter-spacing:0.28em;font-weight:500">MỘC</span>
    </a>
    <nav style="display:flex;gap:26px;margin-left:auto;flex-wrap:wrap;font-size:14px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
        <a href="{{ it.href }}" style="color:{{ it.color }};font-weight:{{ it.weight }};text-decoration:none;padding:4px 0;border-bottom:1px solid {{ it.line }};transition:color .2s" style-hover="color:#1a1412">{{ it.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <sc-if value="{{ guest }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ openLogin }}" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" style="font-family:inherit;font-size:14px;font-weight:500;color:#1a1412;padding:4px 16px 4px 4px;border-radius:999px;border:1px solid {{ lgBorder }};background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;transform:{{ lgLift }};box-shadow:{{ lgShadow }};transition:border-color .25s,transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s">
          <span style="width:32px;height:32px;border-radius:50%;background:{{ lgDot }};display:grid;place-items:center;transition:background .3s">
            <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="5.6" r="2.7" fill="none" stroke="{{ lgIcon }}" stroke-width="1.4"></circle><path d="M2.8 13.6c.9-2.5 2.9-3.8 5.2-3.8s4.3 1.3 5.2 3.8" fill="none" stroke="{{ lgIcon }}" stroke-width="1.4" stroke-linecap="round"></path></svg>
          </span>
          Đăng nhập
        </button>
      </sc-if>
      <a href="Studio.dc.html" style="background:#a3161c;color:#fff;font-size:14px;font-weight:500;padding:10px 20px;border-radius:999px;text-decoration:none;transition:background .2s" style-hover="background:#7d0f14;color:#fff">Tạo thiệp</a>
      <sc-if value="{{ authed }}" hint-placeholder-val="{{ false }}">
        <div style="position:relative">
          <button onClick="{{ toggleMenu }}" aria-label="Tài khoản" style="font-family:inherit;display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid {{ menuBorder }};background:#fff;cursor:pointer;transition:border-color .2s" style-hover="border-color:#1a1412">
            <span style="width:32px;height:32px;border-radius:50%;background:#24493a;color:#f1e7d6;display:grid;place-items:center;font-size:13px;font-weight:600">{{ initials }}</span>
            <span style="font-size:14px;color:#1a1412;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ shortName }}</span>
            <svg width="10" height="10" viewBox="0 0 10 10" style="transform:{{ caret }};transition:transform .2s"><path d="M2 3.5l3 3 3-3" fill="none" stroke="#5e534b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;right:0;top:calc(100% + 10px);width:260px;background:#fff;border:1px solid #e8dfd3;border-radius:16px;box-shadow:0 18px 36px -18px rgba(26,20,18,.35);padding:8px;display:flex;flex-direction:column;z-index:60;animation:mocDrop .22s cubic-bezier(.2,.7,.2,1) both">
              <div style="display:flex;align-items:center;gap:12px;padding:12px 12px 14px;border-bottom:1px solid #efe6d9;margin-bottom:6px">
                <span style="width:40px;height:40px;flex:none;border-radius:50%;background:#24493a;color:#f1e7d6;display:grid;place-items:center;font-size:15px;font-weight:600">{{ initials }}</span>
                <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:500;color:#1a1412">{{ name }}</span><span style="font-size:12px;color:#8a7d72;overflow:hidden;text-overflow:ellipsis">{{ email }}</span></div>
              </div>
              <a href="Thiep Cua Toi.dc.html" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:14px;color:#1a1412;text-decoration:none" style-hover="background:#f8f4ee;color:#1a1412">
                <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.5" fill="none" stroke="#5e534b" stroke-width="1.3"></rect><path d="M2.5 4.5L8 8.5l5.5-4" fill="none" stroke="#5e534b" stroke-width="1.3"></path></svg>Thiệp của tôi
              </a>
              <button onClick="{{ logout }}" style="font-family:inherit;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:14px;color:#a3161c;background:transparent;border:0;cursor:pointer;text-align:left" style-hover="background:#f5e3e1">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 3H3.5v10H6M10 5l3 3-3 3M13 8H6.5" fill="none" stroke="#a3161c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>Đăng xuất
              </button>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </div>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:30"></div>
</sc-if>
<sc-if value="{{ loginOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeLogin }}" style="position:fixed;inset:0;z-index:100;background:rgba(28,16,18,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:mocFade .25s both">
    <div onClick="{{ stop }}" role="dialog" aria-label="Đăng nhập" style="position:relative;width:100%;max-width:420px;background:#f8f4ee;border-radius:24px;padding:44px 36px 32px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;box-shadow:0 40px 80px -40px rgba(0,0,0,.8);animation:mocPop .4s cubic-bezier(.2,.7,.2,1) both">
      <button onClick="{{ closeLogin }}" aria-label="Đóng" style="position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#8a7d72;font-size:16px;cursor:pointer" style-hover="background:#efe6d9;color:#1a1412">✕</button>
      <span style="width:52px;height:52px;border-radius:12px;background:#a3161c;color:#f8f4ee;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:26px;font-weight:600">M</span>
      <div style="display:flex;flex-direction:column;gap:10px">
        <h2 style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:30px;line-height:1.15;color:#1a1412">Đăng nhập vào <em style="color:#8a6425">Mộc</em></h2>
        <p style="margin:0;font-size:14px;line-height:1.65;color:#5e534b;text-wrap:pretty">Lưu thiệp vào tài khoản để mở trên mọi thiết bị và theo dõi khách xác nhận.</p>
      </div>
      <button onClick="{{ google }}" style="width:100%;font-family:inherit;font-size:15px;font-weight:500;padding:15px 20px;border-radius:999px;border:1px solid #ddd2c4;background:#fff;color:#1a1412;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:12px;transition:border-color .2s,box-shadow .2s" style-hover="border-color:#1a1412;box-shadow:0 12px 32px -14px rgba(26,20,18,.3)">
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span style="width:18px;height:18px;border-radius:50%;border:2px solid #e8dfd3;border-top-color:#1a1412;animation:mocSpin .7s linear infinite"></span></sc-if>
        <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"></path><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"></path><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"></path><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"></path></svg></sc-if>
        {{ cta }}
      </button>
      <span style="font-size:12px;line-height:1.6;color:#8a7d72">Khi tiếp tục, bạn đồng ý với <a href="Phap Ly.dc.html" style="color:#a3161c">Điều khoản</a> và <a href="Phap Ly.dc.html?doc=privacy" style="color:#a3161c">Quyền riêng tư</a>.</span>
    </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;templates&quot;,&quot;tools&quot;,&quot;help&quot;,&quot;mine&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const KEY = 'moc_user';
const readUser = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } };
class Component extends DCLogic {
  state = { user: readUser(), loginOpen: false, menuOpen: false, loading: false };
  componentDidMount() {
    this.sync = () => this.setState({ user: readUser() });
    this.open = () => this.setState({ loginOpen: true, menuOpen: false });
    this.key = e => { if (e.key === 'Escape') this.setState({ loginOpen: false, menuOpen: false }); };
    addEventListener('moc-auth', this.sync); addEventListener('storage', this.sync);
    addEventListener('moc-open-login', this.open); addEventListener('keydown', this.key);
  }
  componentWillUnmount() {
    removeEventListener('moc-auth', this.sync); removeEventListener('storage', this.sync);
    removeEventListener('moc-open-login', this.open); removeEventListener('keydown', this.key);
    clearTimeout(this.t);
  }
  setUser(u) {
    try { u ? localStorage.setItem(KEY, JSON.stringify(u)) : localStorage.removeItem(KEY); } catch (e) {}
    dispatchEvent(new Event('moc-auth'));
  }
  renderVals() {
    const a = this.props.active ?? '', s = this.state, u = s.user;
    const items = [['templates','Mẫu thiệp','Mau Thiep v2.dc.html'],['tools','Công cụ','Cong Cu.dc.html']]
      .map(([k,label,href]) => ({ label, href, color: k===a?'#1a1412':'#5e534b', weight: k===a?500:400, line: k===a?'#1a1412':'transparent' }));
    const parts = (u?.name || '').trim().split(/\s+/);
    return {
      items, guest: !u, authed: !!u,
      name: u?.name, email: u?.email, shortName: parts.slice(-2).join(' '),
      initials: parts.length ? (parts[parts.length-1][0] || '').toUpperCase() : '',
      menuOpen: s.menuOpen, caret: s.menuOpen ? 'rotate(180deg)' : 'none', menuBorder: s.menuOpen ? '#1a1412' : '#e8dfd3',
      loginOpen: s.loginOpen, loading: s.loading, idle: !s.loading,
      cta: s.loading ? 'Đang kết nối Google…' : 'Tiếp tục với Google',
      lgBorder: s.lgHover ? '#1a1412' : '#e8dfd3', lgLift: s.lgHover ? 'translateY(-1px)' : 'none',
      lgShadow: s.lgHover ? '0 12px 24px -14px rgba(26,20,18,.35)' : 'none',
      lgDot: s.lgHover ? '#a3161c' : '#efe6d9', lgIcon: s.lgHover ? '#fff' : '#5e534b',
      hoverOn: () => this.setState({ lgHover: true }), hoverOff: () => this.setState({ lgHover: false }),
      openLogin: () => this.setState({ loginOpen: true, lgHover: false }),
      closeLogin: () => !s.loading && this.setState({ loginOpen: false }),
      stop: e => e.stopPropagation(),
      google: () => {
        if (s.loading) return;
        this.setState({ loading: true });
        this.t = setTimeout(() => { this.setUser({ name: 'Nguyễn Thu Hà', email: 'thuha.nguyen@gmail.com' }); this.setState({ loading: false, loginOpen: false }); }, 1100);
      },
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      logout: () => { this.setUser(null); this.setState({ menuOpen: false }); },
    };
  }
}
</script>
</body>
</html>
