<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#f8f4ee;color:#1a1412;font-family:'Be Vietnam Pro',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#a3161c;text-decoration:none}a:hover{color:#7d0f14}*{box-sizing:border-box}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:11px 16px;font-size:14px;border-bottom:1px solid #e0d5c6}
th{background:#efe6d9;font-weight:600;color:#1a1412;white-space:nowrap}
td{color:#3d342e}
</style>
<script src="motion.js"></script>
</helmet>
<div style="min-height:100vh">
  <dc-import name="Site Header" style="position:sticky;top:0;z-index:40;display:block" hint-size="100%,64px"></dc-import>

  <main style="max-width:1180px;margin:0 auto;padding:56px 32px 0">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:28px">
      <a href="Blog.dc.html" style="font-size:13px;color:#8a7d72">Blog</a><span style="color:#c9a86a">/</span><span style="font-size:13px;color:#8a7d72">{{ art.category }}</span>
    </div>
  </main>

  <article style="max-width:1180px;margin:0 auto;padding:0 32px 100px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:56px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:32px;min-width:0">
      <div style="display:flex;flex-direction:column;gap:16px;animation:fadeUp .7s both">
        <span style="font-size:12px;letter-spacing:.14em;color:#8a6425;font-weight:600;text-transform:uppercase">{{ art.category }}</span>
        <h1 style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(32px,4.4vw,52px);line-height:1.12">{{ art.title }}</h1>
        <p style="margin:0;font-size:17px;line-height:1.7;color:#5e534b;max-width:680px">{{ art.excerpt }}</p>
        <span style="font-size:13px;color:#8a7d72">{{ art.date }} · {{ art.read }}</span>
      </div>
      <div style="border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 24px 48px -24px rgba(26,20,18,.35)">
        <image-slot id="{{ art.imgId }}" src="{{ art.cover }}" shape="rect" placeholder="Ảnh bài viết"></image-slot>
      </div>

      <div style="display:flex;flex-direction:column;gap:22px;font-size:16px;line-height:1.8;color:#3d342e;max-width:720px">
        <sc-for list="{{ art.blocks }}" as="bl" hint-placeholder-count="8">
          <sc-if value="{{ bl.isH2 }}" hint-placeholder-val="{{ false }}"><h2 id="{{ bl.id }}" style="margin:14px 0 0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(24px,2.8vw,32px);color:#1a1412;scroll-margin-top:96px">{{ bl.text }}</h2></sc-if>
          <sc-if value="{{ bl.isP }}" hint-placeholder-val="{{ false }}"><p style="margin:0;text-wrap:pretty">{{ bl.text }}</p></sc-if>
          <sc-if value="{{ bl.isQuote }}" hint-placeholder-val="{{ false }}">
            <blockquote style="margin:4px 0;background:#efe6d9;border-radius:16px;padding:28px 32px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.6;color:#3d342e">{{ bl.text }}</blockquote>
          </sc-if>
          <sc-if value="{{ bl.isList }}" hint-placeholder-val="{{ false }}">
            <ul style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px">
              <sc-for list="{{ bl.items }}" as="li" hint-placeholder-count="4"><li style="text-wrap:pretty">{{ li }}</li></sc-for>
            </ul>
          </sc-if>
          <sc-if value="{{ bl.isTable }}" hint-placeholder-val="{{ false }}">
            <div style="overflow-x:auto;border-radius:12px;border:1px solid #e0d5c6">
              <table>
                <thead><tr><sc-for list="{{ bl.headers }}" as="h" hint-placeholder-count="3"><th>{{ h }}</th></sc-for></tr></thead>
                <tbody>
                  <sc-for list="{{ bl.rows }}" as="row" hint-placeholder-count="4">
                    <tr><sc-for list="{{ row.cells }}" as="cell" hint-placeholder-count="3"><td>{{ cell }}</td></sc-for></tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
          </sc-if>
        </sc-for>
      </div>

      <div style="display:flex;flex-direction:column;gap:4px;margin-top:20px;padding-top:36px;border-top:1px solid #1a1412">
        <h2 style="margin:0 0 16px;font-family:'Playfair Display',serif;font-weight:400;font-size:28px">Câu hỏi thường gặp</h2>
        <sc-for list="{{ art.faq }}" as="f" hint-placeholder-count="3">
          <div style="padding:20px 0;border-bottom:1px solid #e0d5c6;display:flex;flex-direction:column;gap:8px">
            <span style="font-family:'Playfair Display',serif;font-size:17px;font-weight:500;color:#1a1412">{{ f.q }}</span>
            <span style="font-size:15px;line-height:1.7;color:#5e534b">{{ f.a }}</span>
          </div>
        </sc-for>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:24px;margin-top:12px">
        <sc-for list="{{ art.related }}" as="r" hint-placeholder-count="2">
          <a href="{{ r.href }}" style="flex:1 1 260px;min-width:220px;background:#efe6d9;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit">
            <span style="font-size:12px;letter-spacing:.1em;color:#8a7d72;text-transform:uppercase">Xem thêm</span>
            <span style="font-family:'Playfair Display',serif;font-size:18px;color:#1a1412">{{ r.title }}</span>
          </a>
        </sc-for>
      </div>
    </div>

    <aside style="position:sticky;top:96px;display:flex;flex-direction:column;gap:16px">
      <span style="font-size:12px;letter-spacing:.14em;color:#8a7d72;font-weight:600;text-transform:uppercase">Mục lục</span>
      <sc-for list="{{ art.toc }}" as="t" hint-placeholder-count="5">
        <a href="{{ t.href }}" style="font-size:13.5px;line-height:1.5;color:#5e534b">{{ t.text }}</a>
      </sc-for>
      <a href="Studio.dc.html" style="margin-top:16px;background:#a3161c;color:#fff;padding:14px 18px;border-radius:999px;font-size:14px;font-weight:500;text-align:center" style-hover="background:#7d0f14;color:#fff">Tạo thiệp miễn phí</a>
    </aside>
  </article>

  <dc-import name="Site Footer" hint-size="100%,520px"></dc-import>
</div>

</x-dc>
