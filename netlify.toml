[build]
  command = "npm run build:next"
  publish = ".next"

# Canonical host: www subdomain -> apex (Seobility: no www/non-www duplicate).
[[redirects]]
  from = "https://www.moc-wedding.netlify.app/*"
  to = "https://moc-wedding.netlify.app/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
